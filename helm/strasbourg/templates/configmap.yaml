apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strasbourg.fullname" . }}-config
  labels:
    {{- include "strasbourg.labels" . | nindent 4 }}
data:
  QUARKUS_PROFILE: {{ .Values.env.quarkusProfile | quote }}
  STRASBOURG_OUTBOX_POLL_INTERVAL: {{ .Values.env.outboxPollInterval | quote }}
  STRASBOURG_OUTBOX_MAX_RETRIES: {{ .Values.env.outboxMaxRetries | quote }}
  STRASBOURG_OUTBOX_RETRY_BACKOFF_SECONDS: {{ .Values.env.outboxRetryBackoffSeconds | quote }}
  DB_JDBC_URL: {{ .Values.env.dbJdbcUrl | quote }}

