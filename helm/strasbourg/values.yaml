replicaCount: 2

image:
  repository: ghcr.io/your-org/strasbourg
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  host: strasbourg.local
  path: /
  pathType: Prefix

env:
  quarkusProfile: prod
  outboxPollInterval: "5s"
  outboxMaxRetries: "5"
  outboxRetryBackoffSeconds: "30"
  dbJdbcUrl: "jdbc:postgresql://postgresql:5432/strasbourg"

secrets:
  existingSecretName: strasbourg-secrets
  dbUsernameKey: db-username
  dbPasswordKey: db-password

