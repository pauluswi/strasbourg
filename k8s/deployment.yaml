apiVersion: apps/v1
kind: Deployment
metadata:
  name: strasbourg
  namespace: strasbourg
  labels:
    app.kubernetes.io/name: strasbourg
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: strasbourg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strasbourg
    spec:
      containers:
        - name: strasbourg
          image: ghcr.io/your-org/strasbourg:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: strasbourg-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: strasbourg-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: strasbourg-secrets
                  key: db-password
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15

